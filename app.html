<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local JSON Fetch & Responsive App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6 md:p-12">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800">🚀 Local Data & Responsive Grid</h1>
            <p class="text-slate-600 mt-2">Fetched dynamically via JavaScript from local <code class="bg-slate-200 px-2 py-1 rounded">data.json</code></p>
        </header>

        <!-- Dynamic Card Grid (Responsive: 1 col on mobile, 2 on tablet+) -->
        <div id="card-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Cards injected by JS -->
        </div>
    </div>

    <script>
        // Fetch local JSON data without CORS issues on local server
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('card-container');
                container.innerHTML = ''; // Clear loading state

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-xl shadow-md border border-slate-200 hover:shadow-lg transition";
                    card.innerHTML = `
                        <span class="text-xs font-semibold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">${item.category}</span>
                        <h3 class="text-xl font-bold text-slate-800 mt-3">${item.term}</h3>
                        <p class="text-slate-600 mt-2 text-sm">${item.description}</p>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => console.error('Error loading JSON:', error));
    </script>
</body>
</html>
